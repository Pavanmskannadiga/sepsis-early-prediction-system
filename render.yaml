services:
  - type: web
    name: sepsis-early-prediction-system
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: ICU_PATIENT_COUNT
        value: 12
      - key: PYTHONUNBUFFERED
        value: 1
      - key: SEPSIS_API_KEY
        generateValue: true
