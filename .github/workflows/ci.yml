name: CI & Deployment Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Model Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install CPU PyTorch
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          pytest tests/ -v

      - name: Smoke test FastAPI server startup
        run: |
          python -c "import backend.server as s; print('FastAPI app initialized successfully, routes:', len(s.app.routes))"
